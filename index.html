<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cardápio Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 1. TRAVA DE ESTRUTURA */
        * { box-sizing: border-box; }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow-x: hidden;
        }

        /* 2. FUNDO TOTALMENTE ESTÁTICO */
        .fundo-fixo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            /* Se a imagem não aparecer, verifique o link ou use fundo.jpg se subir o arquivo no GitHub */
            background-image: url('https://lh3.googleusercontent.com/d/1KXDrWcwSgJod3V7RtC6IesZm6o5apLhD');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        /* Camada escura para dar leitura ao texto */
        .fundo-fixo::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        /* 3. NAVBAR FIXA NO TOPO */
        #menu-categorias {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.85) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 5px;
        }

        .nav-pills .nav-link {
            color: #ccc;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            white-space: nowrap;
            cursor: pointer;
        }

        .nav-pills .nav-link.clicado {
            background-color: #ffe600 !important;
            color: #000 !important;
        }

        /* 4. LISTA DE PRODUTOS */
        .scrollspy-container {
            padding: 10px;
            padding-bottom: 140px; /* Espaço para o botão não cobrir o último item */
        }

        .categoria-header {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            font-weight: 800;
            color: #ffe600;
            text-transform: uppercase;
            font-size: 1rem;
            margin: 25px 0 10px 0;
            border-radius: 8px;
            border-left: 5px solid #ffe600;
        }

        .item-lista {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 15px;
            background: rgba(255, 255, 255, 0.15);
            margin-bottom: 6px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nome-produto { font-size: 1.05rem; font-weight: 600; text-shadow: 1px 1px 2px #000; margin: 0; }
        .preco-produto { font-size: 1.15rem; font-weight: 700; color: #4ade80; text-shadow: 1px 1px 2px #000; margin: 0; }

        /* 5. BOTÕES - + */
        .controles { display: flex; align-items: center; gap: 15px; }

        .btn-acao {
            background: #ffe600;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            cursor: pointer;
        }

        /* 6. BARRA FINALIZAR (Sempre visível) */
        .barra-flutuante {
            position: fixed;
            bottom: 25px;
            left: 5%;
            width: 90%;
            background: #ffe600;
            padding: 18px;
            border-radius: 18px;
            display: none;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
            z-index: 2000;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="fundo-fixo"></div>

    <nav id="menu-categorias" class="navbar">
        <ul class="nav nav-pills flex-nowrap overflow-x-auto w-100 px-2">
            <li class="nav-item"><a class="nav-link clicado" onclick="irPara('cat-coxinhas', this)">Coxinhas</a></li>
            <li class="nav-item"><a class="nav-link" onclick="irPara('cat-hamburgueres', this)">Hambúrgueres</a></li>
            <li class="nav-item"><a class="nav-link" onclick="irPara('cat-pizzas', this)">Pizzas</a></li>
            <li class="nav-item"><a class="nav-link" onclick="irPara('cat-esfihas', this)">Esfihas</a></li>
        </ul>
    </nav>

    <div class="scrollspy-container">
        <div id="cardapio-corpo"></div>
    </div>

    <button id="btn-finalizar" class="barra-flutuante" onclick="enviarWhatsApp()">
        <div style="font-weight:800; color: #000; font-size: 1.1rem;">VER SACOLA <span id="total-itens" class="badge bg-dark ms-1">0</span></div>
        <div style="font-weight:900; color: #000; font-size: 1.2rem;" id="total-preco">R$ 0,00</div>
    </button>

    <script>
        // Função de navegação corrigida
        function irPara(id, elemento) {
            const destino = document.getElementById(id);
            if(destino) {
                window.scrollTo({
                    top: destino.offsetTop - 80,
                    behavior: 'smooth'
                });
            }
            const links = document.querySelectorAll('.nav-link');
            links.forEach(l => l.classList.remove('clicado'));
            elemento.classList.add('clicado');
        }

        const produtos = [
            { cat: "Coxinhas", cid: "cat-coxinhas", nome: "Coxinha de Frango", preco: 8.00, qtd: 0 },
            { cat: "Coxinhas", cid: "cat-coxinhas", nome: "Coxinha Frango c/ Catupiry", preco: 9.00, qtd: 0 },
            { cat: "Coxinhas", cid: "cat-coxinhas", nome: "Coxinha de Carne Seca", preco: 10.00, qtd: 0 },
            { cat: "Coxinhas", cid: "cat-coxinhas", nome: "Coxinha de Calabresa", preco: 8.50, qtd: 0 },
            
            { cat: "Hambúrgueres", cid: "cat-hamburgueres", nome: "X-Burguer Clássico", preco: 18.00, qtd: 0 },
            { cat: "Hambúrgueres", cid: "cat-hamburgueres", nome: "X-Salada Especial", preco: 20.00, qtd: 0 },
            { cat: "Hambúrgueres", cid: "cat-hamburgueres", nome: "X-Bacon Turbo", preco: 25.00, qtd: 0 },
            { cat: "Hambúrgueres", cid: "cat-hamburgueres", nome: "X-Tudo Lanchonete", preco: 32.00, qtd: 0 },

            { cat: "Pizzas", cid: "cat-pizzas", nome: "Pizza Mussarela", preco: 58.00, qtd: 0 },
            { cat: "Pizzas", cid: "cat-pizzas", nome: "Pizza Calabresa", preco: 60.00, qtd: 0 },
            { cat: "Pizzas", cid: "cat-pizzas", nome: "Pizza Portuguesa", preco: 65.00, qtd: 0 },
            { cat: "Pizzas", cid: "cat-pizzas", nome: "Pizza Frango c/ Bacon", preco: 68.00, qtd: 0 },

            { cat: "Esfihas", cid: "cat-esfihas", nome: "Esfiha de Carne", preco: 6.00, qtd: 0 },
            { cat: "Esfihas", cid: "cat-esfihas", nome: "Esfiha de Queijo", preco: 6.50, qtd: 0 },
            { cat: "Esfihas", cid: "cat-esfihas", nome: "Esfiha de Frango", preco: 6.00, qtd: 0 },
            { cat: "Esfihas", cid: "cat-esfihas", nome: "Esfiha de Escarola", preco: 7.00, qtd: 0 }
        ];

        function renderizar() {
            const container = document.getElementById('cardapio-corpo');
            let html = '';
            let ultimaCat = '';
            produtos.forEach((p, i) => {
                if (p.cat !== ultimaCat) {
                    html += `<div id="${p.cid}" class="categoria-header">${p.cat}</div>`;
                    ultimaCat = p.cat;
                }
                html += `
                <div class="item-lista">
                    <div class="info-produto">
                        <p class="nome-produto">${p.nome}</p>
                        <p class="preco-produto">R$ ${p.preco.toLocaleString('pt-br', { minimumFractionDigits: 2 })}</p>
                    </div>
                    <div class="controles">
                        ${p.qtd > 0 ? `<button class="btn-acao" onclick="alterar(${i}, -1)">-</button><span class="fw-bold px-1" style="font-size:1.2rem">${p.qtd}</span>` : ''}
                        <button class="btn-acao" onclick="alterar(${i}, 1)">+</button>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function alterar(i, delta) {
            produtos[i].qtd += delta;
            if (produtos[i].qtd < 0) produtos[i].qtd = 0;
            renderizar();
            atualizarSacola();
        }

        function atualizarSacola() {
            let q = 0, v = 0;
            produtos.forEach(p => { q += p.qtd; v += (p.qtd * p.preco); });
            const btn = document.getElementById('btn-finalizar');
            if (q > 0) {
                btn.style.display = 'flex';
                document.getElementById('total-itens').innerText = q;
                document.getElementById('total-preco').innerText = `R$ ${v.toLocaleString('pt-br', { minimumFractionDigits: 2 })}`;
            } else { btn.style.display = 'none'; }
        }

        function enviarWhatsApp() {
            let msg = "🍔 *NOVO PEDIDO*%0A%0A";
            produtos.forEach(p => { if (p.qtd > 0) { msg += `• ${p.qtd}x ${p.nome}%0A`; } });
            window.open(`https://wa.me/5511949829608?text=${msg}`, '_blank');
        }

        renderizar();
    </script>
</body>
</html>
