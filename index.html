<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { background: transparent; color: white; font-family: 'Segoe UI', sans-serif; padding-bottom: 80px; }

        /* Estilo da Linha do Produto */
        .produto-linha {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .preco { font-weight: 700; color: #ff8a00; font-size: 1.1rem; }

        /* Seletor - 0 + */
        .seletor-caixa {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            border: 1px solid rgba(255, 138, 0, 0.4);
            padding: 2px 8px;
        }

        .btn-math {
            background: transparent; border: none; color: #ff8a00;
            font-size: 1.4rem; font-weight: bold; padding: 0 10px; cursor: pointer;
        }

        .qtd-num { font-weight: 800; min-width: 25px; text-align: center; }

        /* BARRA FLUTUANTE (iFood Style) */
        .barra-flutuante {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: #ff8a00;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            display: none; /* Escondida por padrão */
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            z-index: 9999;
            cursor: pointer;
        }

        .qtd-total-circulo {
            background: rgba(0,0,0,0.2);
            padding: 2px 10px;
            border-radius: 6px;
            font-weight: 800;
            margin-right: 10px;
        }

        .texto-btn { font-weight: 700; text-transform: uppercase; font-size: 0.9rem; }
        .valor-final { font-weight: 800; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="produto-linha">
        <span class="preco">Coxinha R$ 8,00</span>
        <div class="seletor-caixa">
            <button class="btn-math" onclick="mudar(0, -1)">-</button>
            <span class="qtd-num" id="qtd-0">0</span>
            <button class="btn-math" onclick="mudar(0, 1)">+</button>
        </div>
    </div>

    <div class="produto-linha">
        <span class="preco">Hambúrguer R$ 25,00</span>
        <div class="seletor-caixa">
            <button class="btn-math" onclick="mudar(1, -1)">-</button>
            <span class="qtd-num" id="qtd-1">0</span>
            <button class="btn-math" onclick="mudar(1, 1)">+</button>
        </div>
    </div>
</div>

<div id="barra-pedido" class="barra-flutuante" onclick="enviarWhatsApp()">
    <div>
        <span class="qtd-total-circulo" id="soma-qtd">0</span>
        <span class="texto-btn">Ver Pedido</span>
    </div>
    <span class="valor-final" id="soma-valor">R$ 0,00</span>
</div>

<script>
    // Dados dos produtos
    const produtos = [
        { nome: "Coxinha", preco: 8.00, qtd: 0 },
        { nome: "Hambúrguer", preco: 25.00, qtd: 0 }
    ];

    function mudar(index, valor) {
        produtos[index].qtd += valor;
        if (produtos[index].qtd < 0) produtos[index].qtd = 0;
        
        // Atualiza número individual
        document.getElementById(`qtd-${index}`).innerText = produtos[index].qtd;
        
        atualizarBarra();
    }

    function atualizarBarra() {
        let totalQtd = 0;
        let totalValor = 0;

        produtos.forEach(p => {
            totalQtd += p.qtd;
            totalValor += (p.qtd * p.preco);
        });

        const barra = document.getElementById('barra-pedido');
        if (totalQtd > 0) {
            barra.style.display = 'flex';
            document.getElementById('soma-qtd').innerText = totalQtd;
            document.getElementById('soma-valor').innerText = `R$ ${totalValor.toLocaleString('pt-br', {minimumFractionDigits: 2})}`;
        } else {
            barra.style.display = 'none';
        }
    }

    function enviarWhatsApp() {
        let msg = "🍕 *NOVO PEDIDO*%0A%0A";
        let final = 0;
        
        produtos.forEach(p => {
            if (p.qtd > 0) {
                let sub = p.qtd * p.preco;
                msg += `• ${p.qtd}x ${p.nome} (R$ ${sub.toFixed(2)})%0A`;
                final += sub;
            }
        });

        msg += `%0A💰 *TOTAL: R$ ${final.toLocaleString('pt-br', {minimumFractionDigits: 2})}*`;
        window.open(`https://wa.me/5511949829608?text=${msg}`, '_blank');
    }
</script>

</body>
</html>
